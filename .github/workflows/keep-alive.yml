name: Keep Streamlit Alive

on:
  schedule:
    # Ping every 2 hours as a backup to the pg_cron (which runs every 10 min)
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake up Streamlit app
        run: |
          # /healthz bypasses Streamlit Cloud's SSO auth redirect
          # (main URL redirects into an auth loop when the session is fresh)
          URL="https://moex-volume-analytics-cvssujr7yjomlejhacd5nn.streamlit.app/healthz"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              "$URL" \
              2>/dev/null)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "App is awake"
              exit 0
            fi
            echo "Waiting 15s before retry..."
            sleep 15
          done
          echo "::warning::App may still be sleeping after 3 attempts"
