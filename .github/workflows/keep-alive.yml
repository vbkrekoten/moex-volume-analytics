name: Keep Streamlit Alive

on:
  schedule:
    # Ping every 5 hours to prevent Streamlit Community Cloud from sleeping
    - cron: "0 1,6,11,16,21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake up Streamlit app
        run: |
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 90 \
              "https://moex-volume-analytics-cvssujr7yjomlejhacd5nn.streamlit.app/" \
              2>/dev/null)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "App is awake"
              exit 0
            fi
            echo "Waiting 30s before retry..."
            sleep 30
          done
          echo "::warning::App may still be sleeping after 3 attempts"
